# Local profile: run-local.bat|sh passes -Dspring.profiles.active=local
spring.cloud.config.enabled=false
# Fat mock-sdk-*-jar-with-dependencies.jar on loader.path registers Boot JDBC/JPA.
# Cluster zip does not, so these excludes must not be in the default profile.
spring.autoconfigure.exclude=\
org.springframework.boot.jdbc.autoconfigure.DataSourceAutoConfiguration,\
org.springframework.boot.jdbc.autoconfigure.DataSourceInitializationAutoConfiguration,\
org.springframework.boot.jdbc.autoconfigure.DataSourceTransactionManagerAutoConfiguration,\
org.springframework.boot.hibernate.autoconfigure.HibernateJpaAutoConfiguration,\
${biosdk.kernel.autoconfigure.exclude}
server.tomcat.accesslog.enabled=false
# Swagger Try-it-out target for this machine only. Cluster uses mosipbox.public.url from config server.
mosipbox.public.url=http://localhost:${server.port}

#iam mock-sdk config
sdk_check_iso_timestamp_format=true
biosdk_class=io.mosip.mock.sdk.impl.SampleSDKV2
mosip.role.biosdk.getservicestatus=REGISTRATION_PROCESSOR
biosdk_bioapi_impl=io.mosip.mock.sdk.impl.SampleSDKV2
mosip.mocksdk.extraction=true
mosip.mocksdk.extraction.finger.size=2000
mosip.mocksdk.extraction.iris.size=5000
mosip.mocksdk.extraction.face.size=20000


#iam image-compressor config
mosip.bio.image.compressor.resize.factor.fx=0.25
mosip.bio.image.compressor.resize.factor.fy=0.25
mosip.bio.image.compressor.compression.ratio=50